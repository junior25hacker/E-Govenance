<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identity Authentication | Emergence-Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #050d1f;
      --navy-2: #0a1833;
      --navy-3: #0f2347;
      --blue-mid: #1a3a6b;
      --gold: #c9a84c;
      --gold-dim: #7a5f20;
      --border: rgba(201,168,76,0.18);
      --cream: #f2eedf;
      --white: #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* BACKGROUND ORBS */
    .orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; }
    .orb-1 { width: 400px; height: 400px; background: rgba(37,99,176,0.15); top: -100px; right: -100px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(201,168,76,0.1); bottom: -50px; left: -50px; }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--navy-2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-logo { font-family: 'Cinzel'; font-size: 1.3rem; font-weight: 700; letter-spacing: 2px; color: var(--gold); margin-bottom: 4px; }

    /* CAMERA SECTION */
    .camera-container {
      width: 100%;
      aspect-ratio: 16/10;
      background: #000;
      border-radius: 16px;
      margin-bottom: 24px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none; }
    
    .scanner-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: var(--gold); box-shadow: 0 0 15px var(--gold);
      display: none; z-index: 2;
      animation: scan 2.5s linear infinite;
    }
    @keyframes scan { from { top: 0%; } to { top: 100%; } }

    .camera-placeholder {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(201,168,76,0.3);
    }

    /* FORM STYLES */
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
    .form-group input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; color: var(--white); outline: none; transition: 0.3s;
    }
    .form-group input:focus { border-color: var(--gold); background: rgba(255,255,255,0.08); }

    .btn-biometric {
      width: 100%; padding: 14px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: var(--navy); border: none; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; transition: 0.3s; margin-bottom: 20px;
    }
    .btn-biometric:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201,168,76,0.3); }

    .status-bar { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--gold); margin-bottom: 20px; min-height: 1.2em; }

    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; color: rgba(201,168,76,0.2); font-size: 11px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .btn-submit {
      width: 100%; padding: 12px; border-radius: 8px; background: transparent;
      border: 1px solid var(--gold); color: var(--gold); cursor: pointer;
      font-weight: 600; font-size: 14px; transition: 0.2s;
    }
    .btn-submit:hover { background: rgba(201,168,76,0.1); }

    .footer-links { margin-top: 32px; font-size: 12px; text-align: center; }
    .footer-links a { color: var(--gold); text-decoration: none; margin: 0 10px; opacity: 0.8; }
    .footer-links a:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">Emergence-Connect</div>
      <p style="font-size: 13px; opacity: 0.7;">Secure Identity Gateway</p>
    </div>

    <div class="camera-container" id="cam-wrap">
      <video id="video" autoplay playsinline></video>
      <div class="scanner-line" id="scanner"></div>
      <div class="camera-placeholder" id="placeholder">
        <span class="material-symbols-outlined" style="font-size: 48px;">face_retouching_natural</span>
        <p style="font-size: 11px; font-family: 'JetBrains Mono';">Biometric Engine Ready</p>
      </div>
    </div>

    <div class="status-bar" id="status-text">System: Waiting for initialization...</div>

    <button class="btn-biometric" id="bio-trigger" onclick="runLiveness()">
      <span class="material-symbols-outlined">videocam</span>
      Verify with Liveness ID
    </button>

    <div class="divider">OR SECURE PIN ACCESS</div>

    <form onsubmit="handleManualLogin(event)">
      <div class="form-group">
        <label>National ID Number</label>
        <input type="text" placeholder="e.g. 202401..." required>
      </div>
      <div class="form-group">
        <label>Security Pin</label>
        <input type="password" placeholder="••••" required>
      </div>
      <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <div class="footer-links">
      <a href="index.html">← Home</a>
      <a href="help.html">Need Help?</a>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const scanner = document.getElementById('scanner');
    const placeholder = document.getElementById('placeholder');
    const status = document.getElementById('status-text');
    const bioBtn = document.getElementById('bio-trigger');

    async function runLiveness() {
      try {
        status.innerText = "System: Requesting Camera Access...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        scanner.style.display = 'block';
        
        bioBtn.innerHTML = '<span class="material-symbols-outlined">sync</span> Processing...';
        bioBtn.disabled = true;

        status.innerText = "System: Scanning Biometric Geometry...";

        // Simulate liveness detection analysis
        setTimeout(() => {
          status.innerText = "System: Liveness Confirmed. Authenticating...";
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1200);
        }, 3500);

      } catch (err) {
        status.innerText = "Error: Camera access required.";
        console.error(err);
      }
    }

    function handleManualLogin(e) {
      e.preventDefault();
      status.innerText = "System: Verifying Credentials...";
      (async () => {
        try {
          const form = e.target;
          const inputs = form.querySelectorAll('input');
          const emailOrId = inputs[0].value.trim();
          const pin = inputs[1].value.trim();

          const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailOrId, password: pin }),
          });

          const data = await res.json();
          if (!res.ok) {
            status.innerText = data.message || 'Login failed';
            alert(data.message || 'Login failed');
            return;
          }

          // store token and basic profile
          if (data.data && data.data.token) {
            localStorage.setItem('egov_token', data.data.token);
            localStorage.setItem('egov_citizenId', data.data.user?.citizenId || '');
          }

          status.innerText = 'System: Login successful — redirecting...';
          setTimeout(() => (window.location.href = 'dashboard.html'), 800);
        } catch (err) {
          console.error(err);
          status.innerText = 'Network error';
          alert('Network error — could not reach API');
        }
      })();
    }
  </script>
</body>
</html>
